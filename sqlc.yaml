version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/000001_init_schema.up.sql"
      - "migrations/000002_prescriptions_dual_mode.up.sql"
      - "migrations/000004_phase4_scheduling_vitals.up.sql"
      - "migrations/000005_phase5_compliance_and_tokens.up.sql"
      - "migrations/000006_audit_immutability.up.sql"
      - "migrations/000007_admin_entity.up.sql"
      - "migrations/000008_harden_schema_integrity.up.sql"
      - "migrations/000009_patient_booking_exclusion.up.sql"
      - "migrations/000010_harden_relational_integrity.up.sql"
    queries: "internal/repository/queries"
    gen:
      go:
        package: "dbgen"
        out: "internal/repository/dbgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - column: "appointments.status"
            go_type: "github.com/RitwikGupta-0501/vital-watch/internal/models.AppointmentStatus"
          - column: "appointments.appointment_type"
            go_type: "github.com/RitwikGupta-0501/vital-watch/internal/models.AppointmentType"
          - column: "prescriptions.status"
            go_type: "github.com/RitwikGupta-0501/vital-watch/internal/models.PrescriptionStatus"
          - column: "prescriptions.source"
            go_type: "github.com/RitwikGupta-0501/vital-watch/internal/models.PrescriptionSource"
          - column: "patient_medication_logs.status"
            go_type: "github.com/RitwikGupta-0501/vital-watch/internal/models.MedicationLogStatus"
          - column: "patient_medication_logs.time_of_day"
            go_type: "github.com/RitwikGupta-0501/vital-watch/internal/models.MedicationTimeOfDay"
