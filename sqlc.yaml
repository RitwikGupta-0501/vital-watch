version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/000001_init_schema.up.sql"
      - "migrations/000002_prescriptions_dual_mode.up.sql"
      - "migrations/000004_phase4_scheduling_vitals.up.sql"
      - "migrations/000005_phase5_compliance_and_tokens.up.sql"
    queries: "internal/repository/queries"
    gen:
      go:
        package: "dbgen"
        out: "internal/repository/dbgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
